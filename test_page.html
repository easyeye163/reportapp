<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnlyOffice DOCX Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #editor { width: 100%; height: 600px; border: 1px solid #ccc; }
        .status { margin-bottom: 10px; padding: 10px; border-radius: 4px; }
        .status.success { background-color: #e8f5e9; color: #2e7d32; }
        .status.error { background-color: #ffebee; color: #c62828; }
    </style>
</head>
<body>
    <h1>OnlyOffice Document Editor Test - DOCX</h1>
    <div class="status" id="status">Initializing...</div>
    <div id="editor"></div>

    <script type="text/javascript" src="http://192.168.137.148:8088/web-apps/apps/api/documents/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var status = document.getElementById('status');

            if (!window.DocsAPI || !window.DocsAPI.DocEditor) {
                status.className = 'status error';
                status.innerHTML = '❌ Failed to load OnlyOffice API';
                return;
            }

            status.className = 'status success';
            status.innerHTML = '✅ API loaded, initializing editor...';

            new DocsAPI.DocEditor('editor', {
                document: {
                    fileType: 'docx',
                    key: 'test-docx-' + Date.now(),
                    title: 'Test Document.docx',
                    url: 'https://zhangshuxia.ltd:8443/api/onlyoffice/test-doc'
                },
                documentType: 'word',
                editorConfig: {
                    user: { name: 'Test User' },
                    lang: 'zh'
                },
                events: {
                    'onReady': function() {
                        status.className = 'status success';
                        status.innerHTML = '✅ Document loaded successfully!';
                    },
                    'onError': function(event) {
                        status.className = 'status error';
                        status.innerHTML = '❌ Error: ' + JSON.stringify(event.data);
                    }
                },
                width: '100%',
                height: '600px'
            });
        });
    </script>
</body>
</html>
