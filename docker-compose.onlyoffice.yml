# OnlyOffice Document Server 部署配置
# 使用方式: docker compose -f docker-compose.onlyoffice.yml up -d

version: '3.8'

services:
  onlyoffice-document-server:
    image: onlyoffice/documentserver:latest
    container_name: reportapp-onlyoffice
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      # JWT 配置（生产环境务必修改）
      - JWT_SECRET=reportapp-secret-key-2024
      - JWT_ENABLED=true
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-logs:/var/log/onlyoffice
      - onlyoffice-lib:/var/lib/onlyoffice
      - onlyoffice-db:/var/lib/postgresql
    networks:
      - reportapp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  reportapp-network:
    driver: bridge

volumes:
  onlyoffice-data:
  onlyoffice-logs:
  onlyoffice-lib:
  onlyoffice-db:
